name: Build

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: 🏗️ Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"

      - name: 👨🏻‍💻 Install dependencies
        run: go mod download

      - name: 🔧 Allow unprivileged user namespaces for sandbox tests
        # ubuntu-latest ランナーは kernel.apparmor_restrict_unprivileged_userns=1
        # がデフォルトで、AppArmor プロファイルを持たないバイナリ（go test が
        # ビルドする一時テストバイナリを含む）の user+mount namespace 作成を
        # ブロックする。本番の command-relay-agent バイナリには
        # deploy/apparmor/usr.local.bin.command-relay-agent が対応するが、
        # パスが毎回変わるテストバイナリには専用プロファイルを適用できないため、
        # CI 環境限定でこの制限自体を無効化し、sandbox_linux_test.go が実際の
        # namespace 分離・Landlock 挙動を検証できるようにする。
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: 🧪 Test
        run: go test -v ./...

      - name: Check formatting
        run: |
          go fmt ./...
          git diff --exit-code

      - name: 👀 Validate deploy files
        run: |
          go build -o /tmp/command-relay-agent ./agent/cmd
          sudo install -m 0755 /tmp/command-relay-agent /usr/local/bin/command-relay-agent
          systemd-analyze verify --user deploy/systemd/command-relay-agent.service
          sudo rm -f /usr/local/bin/command-relay-agent
          apparmor_parser -Q --skip-cache deploy/apparmor/usr.local.bin.command-relay-agent
