name: Build

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: 🏗️ Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"

      - name: 👨🏻‍💻 Install dependencies
        run: go mod download

      - name: 🧪 Test
        run: go test -v ./...

      - name: Check formatting
        run: |
          go fmt ./...
          git diff --exit-code

      - name: 👀 Validate deploy files
        run: |
          go build -o /tmp/command-relay-agent ./agent/cmd
          sudo install -m 0755 /tmp/command-relay-agent /usr/local/bin/command-relay-agent
          systemd-analyze verify --user deploy/systemd/command-relay-agent.service
          sudo rm -f /usr/local/bin/command-relay-agent
          apparmor_parser -Q --skip-cache deploy/apparmor/usr.local.bin.command-relay-agent
