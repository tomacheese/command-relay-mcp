# Releases the Gateway Docker image (ghcr.io) and the Agent binary
# (GitHub Release) together under the same version tag.
#
# The version tag is issued exactly once, by the docker-ci-gateway job
# (calc-version in reusable-docker.yml), and agent-release reuses it as
# is. Tagging the Gateway and Agent independently in separate workflows
# would run two github-tag-action jobs in parallel for the same merge,
# racing for the same tag name and letting the Gateway and Agent versions
# drift apart.

name: Release

on:
  pull_request:
    branches:
      - main
      - master
    types:
      - opened
      - synchronize
    paths:
      - .github/workflows/release.yml
  pull_request_target:
    branches:
      - main
      - master
    types:
      - opened
      - synchronize
      - reopened
      - closed
  merge_group:

concurrency:
  # Without event_name, pull_request and pull_request_target would share a
  # group and cancel each other; including it keeps their cancellation
  # independent.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write
  deployments: write
  actions: read

jobs:
  post-approval-request:
    name: Post approval request
    runs-on: ubuntu-latest
    # Post the approval request only for fork PRs (not needed on closed).
    if: github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository && github.event.action != 'closed'
    continue-on-error: true
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Find existing approval request comment
        id: find-comment
        uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad # v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: github-actions[bot]
          body-includes: Environment 承認待ち

      - name: Post or update approval request comment
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          edit-mode: replace
          body: |
            ## Environment 承認待ち

            この PR のビルドを実行するには、Environment `fork-pr-build` の承認が必要です。

            [Actions run を確認して承認してください](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}?pr=${{ github.event.pull_request.number }})

  approval-gate:
    name: Approval gate
    runs-on: ubuntu-latest
    needs: post-approval-request
    # Always run, regardless of the post-approval-request result.
    if: always()
    # Manual approval via the Environment is required only for fork PRs that are not closed.
    environment: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository && github.event.action != 'closed' && 'fork-pr-build' || '' }}
    permissions: {}
    steps:
      - name: Approval granted
        run: echo "Approval gate passed"

  docker-ci-gateway:
    name: Docker CI (gateway)
    needs: approval-gate
    if: always() && needs.approval-gate.result == 'success' && (github.event.action != 'closed' || github.event.pull_request.merged == true)
    uses: book000/templates/.github/workflows/reusable-docker.yml@master
    with:
      targets: >-
        [
          { imageName: "tomacheese/command-relay-mcp", context: ".", file: "Dockerfile", packageName: "command-relay-mcp" }
        ]
      # registry: registry.hub.docker.com # default: ghcr.io
      allow-unsafe-pr-checkout: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository }}
    secrets:
      DOCKER_USERNAME: ${{ github.actor }}
      DOCKER_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

  agent-release:
    name: Release Agent binary
    needs: docker-ci-gateway
    # Starts only after docker-ci-gateway has finished every step
    # (including tag issuance). The tag output is computed even in dry-run
    # (unmerged) runs, so together with the GoReleaser snapshot decision
    # (below), needs.docker-ci-gateway.outputs.tag can always be referenced.
    if: always() && needs.docker-ci-gateway.result == 'success' && (github.event.action != 'closed' || github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merged == true && github.base_ref || github.event.pull_request.head.sha || github.sha }}

      - name: Fetch tags
        # docker-ci-gateway has already pushed the tag for this commit
        # (on merge only). The Agent only consumes the tag here and never
        # issues one itself.
        run: git fetch --tags

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"

      - name: Install dependencies
        run: go mod download

      - name: Test
        run: go test -v ./...

      - name: GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          # Release with the real tag only once merged. Otherwise (PR
          # preview, merge_group) the tag computed by docker-ci-gateway in
          # dry-run was never actually pushed, so stay with a snapshot build.
          # GoReleaser's release.mode defaults to keep-existing, so the body
          # of the GitHub Release that docker-ci-gateway already created for
          # the same tag is kept and only the Agent archives are added.
          args: release --clean ${{ github.event.pull_request.merged != true && '--skip=validate,publish --snapshot' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist

      - name: Check formatting
        run: |
          go fmt ./...
          git diff --exit-code
